name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Public config
      PUBLIC_FIREBASE_USE_EMULATORS: "true"
      PUBLIC_FIREBASE_COLLECTION_REACTION_BINOMES: "reactions-test"
      PUBLIC_FIREBASE_COLLECTION_USER_DATA: "users-test"
      PUBLIC_FIREBASE_COLLECTION_PLAYLISTS: "playlists-test"
      PUBLIC_FIREBASE_COLLECTION_QUEUES: "queues-test"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_CLAIMS: "claims-test"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_VERIFICATIONS: "verifications-test"
      PUBLIC_DISABLE_YOUTUBE_METADATA_SYNC: "true"
      # Private config (dummy values for testing)
      YOUTUBE_API_KEY: "dummy_key_for_tests"
      # Algolia config (dummy values for testing)
      PUBLIC_ALGOLIA_APP_ID: "dummy"
      PUBLIC_ALGOLIA_SEARCH_API_KEY: "dummy"
      PUBLIC_ALGOLIA_REACTIONS_INDEX: "dummy"
      CI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install sharp (required for enhanced-img)
        run: npm install --include=optional sharp

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # We wrap the test command with firebase emulators:exec to ensure Firestore is available.
        # We use a demo project ID to bypass authentication requirements for emulators.
        run: npm run test:e2e:ci

      - name: Upload Playwright Result Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
