name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Public config
      PUBLIC_FIREBASE_USE_EMULATORS: "true"
      PUBLIC_FIREBASE_COLLECTION_REACTION_BINOMES: "reactions-local"
      PUBLIC_FIREBASE_COLLECTION_USER_DATA: "userdata-local"
      PUBLIC_FIREBASE_COLLECTION_PLAYLISTS: "playlists-local"
      PUBLIC_FIREBASE_COLLECTION_MOMENTS: "moments-local"
      PUBLIC_FIREBASE_COLLECTION_QUEUES: "queues-local"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_CLAIMS: "youtubeChannelClaims_local"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_VERIFICATIONS: "youtubeChannelVerifications_local"
      PUBLIC_DISABLE_YOUTUBE_METADATA_SYNC: "true"
      # Private config (dummy values for testing)
      YOUTUBE_API_KEY: "dummy_key_for_tests"
      # Algolia config (dummy values for testing)
      PUBLIC_ALGOLIA_APP_ID: "dummy"
      PUBLIC_ALGOLIA_SEARCH_API_KEY: "dummy"
      PUBLIC_ALGOLIA_REACTIONS_INDEX: "dummy"
      CI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Check suite selector
        run: node --test scripts/e2e-suites.test.js

      - name: Select Playwright suites
        id: e2e
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/select-e2e-suites.mjs --all --github-output
          else
            node scripts/select-e2e-suites.mjs --base "origin/${{ github.base_ref }}" --github-output
          fi

      - name: Setup Java
        if: steps.e2e.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        if: steps.e2e.outputs.run == 'true'
        run: npm ci

      - name: Cache Firebase Emulators
        if: steps.e2e.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install Playwright Browsers
        if: steps.e2e.outputs.run == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.e2e.outputs.run == 'true'
        env:
          E2E_SUITES: ${{ steps.e2e.outputs.suites }}
        run: npm run test:e2e:ci

      - name: Upload Playwright Result Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.e2e.outputs.run == 'true' && failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always() && steps.e2e.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
