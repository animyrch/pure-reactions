name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Public config
      PUBLIC_FIREBASE_USE_EMULATORS: "true"
      PUBLIC_FIREBASE_COLLECTION_REACTION_BINOMES: "reactions-test"
      PUBLIC_FIREBASE_COLLECTION_USER_DATA: "users-test"
      PUBLIC_FIREBASE_COLLECTION_PLAYLISTS: "playlists-test"
      PUBLIC_FIREBASE_COLLECTION_QUEUES: "queues-test"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_CLAIMS: "claims-test"
      PUBLIC_FIREBASE_COLLECTION_YOUTUBE_CHANNEL_VERIFICATIONS: "verifications-test"
      CI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # We wrap the test command with firebase emulators:exec to ensure Firestore is available.
        # We use a demo project ID to bypass authentication requirements for emulators.
        run: npm run test:e2e:ci

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
