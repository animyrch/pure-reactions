[build]
  command = "npm run generate-sitemap && npm run build"
  publish = "build"

[build.environment]
  NPM_FLAGS = "--include=optional"

# Keep the Firebase Admin SDK as real packages. The sitemap build imports it
# unbundled and can read Firestore; the inlined function on this preview cannot.
[functions]
  external_node_modules = ["firebase-admin"]

# Reindex Algolia after every successful production deploy.
# The plugin reads ALGOLIA_ADMIN_KEY and FIREBASE_SERVICE_ACCOUNT from
# Netlify private env vars – no secrets are checked in or exposed to the client.
[[plugins]]
  package = "./netlify/plugins/algolia-reindex"

# Static files only. SSR pages set the same framing headers in src/hooks.server.js.
# Netlify does not apply this block to function or SSR responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"