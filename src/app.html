<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
	<meta name="theme-color" content="#050505" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<style>
		/*
		  No universal margin/padding reset here. Tailwind's preflight already
		  sets margin, padding, and box-sizing inside @layer base. An unlayered
		  * rule beats every Tailwind 4 utility, so px-* and mt-* would compute
		  to 0.
		*/
		body {
			background-color: #050505;
			color: #f5f5f5;
			color-scheme: dark;
			min-height: 100vh;
			margin: 0;
			font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
			line-height: 1.5;
		}

		/* Ensure readable defaults for light (white) form controls/containers */
		.bg-white {
			color: #050505;
		}

		input,
		textarea,
		select {
			color: #050505;
			color-scheme: light;
		}

		/* iOS Safe Area Support */
		:root {
			--safe-area-inset-top: env(safe-area-inset-top, 0px);
			--safe-area-inset-right: env(safe-area-inset-right, 0px);
			--safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
			--safe-area-inset-left: env(safe-area-inset-left, 0px);
			
			/* Base positioning values for FAB */
			--fab-offset-bottom: 1.5rem;
			--fab-offset-left: 1.5rem;
		}
	</style>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
